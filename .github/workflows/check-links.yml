name: Check external links

on:
  schedule:
    - cron: "0 14 * * 1"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --accept 200,204,206,301,302,303,307,308,403,429
            './**/*.qmd'
            './**/*.html'
            './**/*.yml'